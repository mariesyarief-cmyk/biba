<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misi Penyelamatan Penting! 🎮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Mencegah teks terseleksi saat ditekan lama di HP */
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            /* Warna Latar Jauh Lebih Terang agar gampang dilihat */
            background: linear-gradient(135deg, #ffffff, #e0f7fa, #fff9c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
            color: #263238;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 95%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: #006064; /* Warna judul selaras tema terang */
        }

        /* --- Gaya Kanvas Game --- */
        canvas {
            /* Latar Kanvas dibuat sedikit lebih kontras dari body */
            background: #f0f4f8;
            display: block;
            margin: 10px auto;
            border-radius: 12px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            border: 3px solid #0097a7;
            max-width: 100%;
            height: auto;
        }

        .instructions {
            font-size: 0.85rem;
            color: #546e7a;
            margin-bottom: 10px;
            font-style: italic;
        }

        /* --- Tombol Virtual Mobile (D-Pad) --- */
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 0 5px;
        }

        .direction-keys {
            display: flex;
            gap: 15px;
        }

        .d-btn {
            width: 60px;
            height: 60px;
            background-color: #0097a7; /* Warna cerah netral */
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #006064; /* Efek tombol 3D */
            transition: all 0.1s;
            /* Menghilangkan efek highlight tap di mobile */
            -webkit-tap-highlight-color: transparent;
        }

        .d-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #006064;
            background-color: #00838f;
        }

        #btnJump {
            border-radius: 15px; 
            width: 80px; 
            background-color: #ff9800; /* Warna beda untuk lompat */
            box-shadow: 0 4px 0 #e65100;
        }
        #btnJump:active {
            box-shadow: 0 2px 0 #e65100;
            background-color: #f57c00;
        }

        .btn-action {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            background-color: #0097a7;
            color: white;
            transition: all 0.2s;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 0 #006064;
        }
        .btn-action:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #006064;
        }

        .hidden {
            display: none !important;
        }

        /* --- Halaman Sukses Akhir --- */
        .success-box {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.95);
        }

        @keyframes popIn {
            from { transform: scale(0.8) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .heart-animation {
            font-size: 4rem;
            animation: beat 0.8s infinite alternate;
            display: inline-block;
            margin: 15px 0;
            color: #e53935;
        }

        @keyframes beat {
            to { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div id="startScreen" class="card">
        <span style="font-size: 3.5rem; display: block; margin-bottom: 10px;">🎮</span>
        <h1>Misi Penyelamatan Biba</h1>
        <p class="instructions">Monster bad mood menculik aku! Kamu harus melompat melewati duri tajam untuk menyelamatkan aku.</p>
        <p class="instructions"><b>Kontrol:</b> Gunakan tombol panah di layar HP atau di keyboard.</p>
        <button class="btn-action" onclick="startGame()">Mulai Sekarang 🏃‍♂️💨</button>
    </div>

    <div id="gameScreen" class="card hidden">
        <h1>Cepat Selamatkan Aku! 💖</h1>
        
        <canvas id="gameCanvas" width="400" height="200"></canvas>

        <div class="controls-container">
            <div class="direction-keys">
                <button class="d-btn" id="btnLeft">◀</button>
                <button class="d-btn" id="btnRight">▶</button>
            </div>
            <button class="d-btn" id="btnJump">UP</button>
        </div>
    </div>

    <form id="successScreen" class="card success-box hidden" action="https://formspree.io/f/mdavzayw" method="POST">
        <span class="heart-animation">💖</span>
        <h1 style="color: #e53935;">MISI BERHASIL!</h1>
        <p style="margin-bottom: 20px; color: #455a64; font-size: 0.95rem; line-height: 1.5;">Makasih banyak pahlawanku!</p>
        
        <input type="hidden" name="Status Penyelamatan" value="SUKSES! Misi diselesaikan dengan muka asli.">
        
        <button type="submit" class="btn-action" style="background-color: #e53935; box-shadow: 0 4px 0 #b71c1c;">Kirim Bukti kema 🏆</button>
    </form>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- PRELOAD GAMBAR MUKA ---
        const imgBiba = new Image();
        imgBiba.src = 'biba.png'; // Ganti format jika perlu (.jpg / .jpeg)

        const imgKamu = new Image();
        imgKamu.src = 'kamu.png'; // Ganti format jika perlu (.jpg / .jpeg)

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            initGame();
        }

        function missionComplete() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');
        }

        // --- ENGINE GAME ---
        let player, obstacles, goal, keys;
        let gameInterval;

        function initGame() {
            player = {
                x: 20,
                y: 130,
                width: 35, // Ukuran sedikit lebih besar agar muka jelas
                height: 35,
                speed: 4.2,
                velX: 0,
                velY: 0,
                jumping: false
            };

            obstacles = [
                { x: 130, y: 145, width: 22, height: 25 },
                { x: 240, y: 145, width: 22, height: 25 },
                { x: 310, y: 125, width: 22, height: 45 }
            ];

            goal = {
                x: 355,
                y: 130,
                width: 40,
                height: 40
            };

            keys = {};

            // Event Keyboard
            window.addEventListener('keydown', (e) => keys[e.key] = true);
            window.addEventListener('keyup', (e) => keys[e.key] = false);

            // Event Mobile Touch
            const bindMobileButton = (btnId, keyName) => {
                const btn = document.getElementById(btnId);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
                // Mouse fallback
                btn.addEventListener('mousedown', () => keys[keyName] = true);
                btn.addEventListener('mouseup', () => keys[keyName] = false);
            };

            bindMobileButton('btnLeft', 'ArrowLeft');
            bindMobileButton('btnRight', 'ArrowRight');
            bindMobileButton('btnJump', 'ArrowUp');

            gameInterval = setInterval(update, 1000 / 60);
        }

        function update() {
            // Kontrol
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                if (!player.jumping) {
                    player.jumping = true;
                    player.velY = -9.2; 
                }
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                if (player.velX > -player.speed) player.velX--;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                if (player.velX < player.speed) player.velX++;
            }

            // Fisika
            player.velX *= 0.8;
            player.velY += 0.58; 

            player.x += player.velX;
            player.y += player.velY;

            // Batas Tanah
            if (player.y >= 135) {
                player.y = 135;
                player.jumping = false;
                player.velY = 0;
            }

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            // Cek Tabrakan Duri
            for (let obs of obstacles) {
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    player.x = 20;
                    player.y = 130;
                }
            }

            // Cek Menang
            if (player.x < goal.x + goal.width &&
                player.x + player.width > goal.x &&
                player.y < goal.y + goal.height &&
                player.y + player.height > goal.y) {
                clearInterval(gameInterval);
                missionComplete();
            }

            draw();
        }

        // --- FUNGSI KHUSUS MENGGAMBAR FOTO TANPA STRETCH (Object Fit: Cover) ---
        function drawCoverImage(img, x, y, width, height) {
            if (!img.complete || img.naturalWidth === 0) return false; // Gagal load

            const imgRatio = img.naturalWidth / img.naturalHeight;
            const targetRatio = width / height;

            let sx, sy, sw, sh;

            // Logika memotong tengah (centering crop)
            if (imgRatio > targetRatio) {
                // Foto terlalu lebar, potong kanan kiri
                sh = img.naturalHeight;
                sw = sh * targetRatio;
                sx = (img.naturalWidth - sw) / 2;
                sy = 0;
            } else {
                // Foto terlalu tinggi, potong atas bawah
                sw = img.naturalWidth;
                sh = sw / targetRatio;
                sx = 0;
                sy = (img.naturalHeight - sh) / 2;
            }

            ctx.drawImage(img, sx, sy, sw, sh, x, y, width, height);
            return true; // Sukses menggambar
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tanah & Rumput (Warna Cerah)
            ctx.fillStyle = '#a1887f';
            ctx.fillRect(0, 170, canvas.width, 30);
            ctx.fillStyle = '#81c784'; 
            ctx.fillRect(0, 170, canvas.width, 6);

            // Rintangan Duri
            ctx.fillStyle = '#263238';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y);
                ctx.lineTo(obs.x + obs.width/2, obs.y - 7);
                ctx.lineTo(obs.x + obs.width, obs.y);
                ctx.fill();
            }

            // Gambar Tujuan (Muka Kamu) tanpa stretch
            const drawnKamu = drawCoverImage(imgKamu, goal.x, goal.y, goal.width, goal.height);
            if(!drawnKamu) {
                // Cadangan jika foto gagal load
                ctx.fillStyle = '#00bcd4';
                ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
            }
            ctx.fillStyle = '#fbc02d';
            ctx.font = '16px sans-serif';
            ctx.fillText('👑', goal.x + 12, goal.y - 5);

            // Gambar Pemain (Muka Biba) tanpa stretch
            const drawnBiba = drawCoverImage(imgBiba, player.x, player.y, player.width, player.height);
            if(!drawnBiba) {
                // Cadangan jika foto gagal load
                ctx.fillStyle = '#e53935';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        document.getElementById('successScreen').addEventListener('submit', function() {
            alert('Bukti cinta berhasil dikirim ke aku! Makasih ya pahlawanku 🥰');
        });
    </script>
</body>
</html>
