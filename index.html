<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤔</title>
    <style>
        /* Gaya Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Warna Latar Netral (Teal/Blue Gray) */
            background: linear-gradient(135deg, #e0f2f1, #b2dfdb, #90caf9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #37474f; /* Warna teks utama */
        }

        /* Animasi Latar Belakang Bergerak */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Gaya Kartu Utama */
        .card {
            background: rgba(255, 255, 255, 0.8);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(1);
        }

        /* Animasi Masuk Kartu */
        #page1, #page2 {
            animation: cardIn 0.6s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #263238; /* Warna judul netral gelap */
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.3;
        }

        /* Kontainer Tombol */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap; /* Untuk layar kecil */
        }

        /* Gaya Tombol Umum */
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 12px; /* Lebih kotak, kurang bulat */
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Tombol Utama (Iya) */
        .btn-yes {
            background-color: #00796b; /* Warna Teal Tua */
            color: white;
        }

        .btn-yes:hover {
            background-color: #00695c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 121, 107, 0.3);
        }

        /* Tombol Menghindar (Bukan) */
        .btn-no {
            background-color: #cfd8dc; /* Warna Abu-abu Kebiruan */
            color: #546e7a;
            position: relative;
            z-index: 10;
        }

        /* Utilitas Tersembunyi */
        .hidden {
            display: none !important;
        }

        /* --- Gaya Khusus Halaman 2 --- */
        .slider-container {
            margin: 35px 0 25px 0;
            position: relative;
        }

        /* Tampilan Persentase Besar */
        .percentage {
            font-size: 4rem;
            font-weight: 800;
            color: #00796b; /* Warna Teal Utama */
            margin-bottom: 10px;
            display: block;
            font-family: 'Courier New', Courier, monospace; /* Gaya digital/mekanis */
        }

        /* Tampilan Teks Progress di bawah persentase */
        .progress-text {
            font-size: 0.9rem;
            color: #78909c;
            margin-bottom: 20px;
            display: block;
            font-style: italic;
        }

        /* Gaya Slider (Jalur) */
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: #b2dfdb; /* Teal Pucat */
            outline: none;
            border: none;
        }

        /* Gaya Slider (Tombol Geser) */
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #00796b; /* Teal Tua */
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 121, 107, 0.4);
            transition: background 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            background: #004d40;
        }

        /* Gaya Emoji */
        .emoji {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Warna Tombol Kirim di Halaman 2 */
        #page2 .btn-yes {
            width: 100%;
            margin-top: 15px;
        }

    </style>
</head>
<body>

    <div id="page1" class="card">
        <span class="emoji">🤨</span>
        <h1>Sebentar deh,<br>ini beneran Biba?</h1>
        <div class="btn-container">
            <button class="btn-yes" onclick="nextPage()">Iya, Ini Biba</button>
            <button class="btn-no" id="btnNo" onmouseover="moveButton()" onclick="moveButton()">Bukan</button>
        </div>
    </div>

    <form id="page2" class="card hidden" action="https://formspree.io/f/mdavzayw" method="POST">
        <span class="emoji" id="reactionEmoji">🤔</span>
        <h1>Udah sejauh mana kamu suka sama aku?</h1>
        
        <div class="slider-container">
            <span class="percentage" id="rangeValue">50%</span>
            <span class="progress-text" id="progressText">Yaa.. lumayan lah ya?</span>
            
            <input type="range" name="Level Suka Biba" class="slider" id="loveSlider" min="0" max="100" value="50" oninput="updateValue(this.value)">
        </div>

        <input type="hidden" name="Konfirmasi Identitas" value="Sudah terverifikasi sebagai Biba">

        <button type="submit" class="btn-yes">Kirim Jawaban</button>
    </form>

    <script>
        // --- Logika Navigasi ---
        function nextPage() {
            // Animasi keluar untuk page 1
            document.getElementById('page1').style.opacity = '0';
            document.getElementById('page1').style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                document.getElementById('page1').classList.add('hidden');
                document.getElementById('page2').classList.remove('hidden');
            }, 400); // Tunggu animasi selesai
        }

        // --- Logika Tombol "Bukan" Menghindar ---
        function moveButton() {
            const btnNo = document.getElementById('btnNo');
            // Area aman agar tombol tidak terlalu ke pinggir
            const padding = 60; 
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - padding * 2) + padding;
            
            // Mengubah posisi tombol menjadi fixed
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
            btnNo.style.transition = 'all 0.2s ease-out'; // Transisi cepat saat menghindar
        }

        // --- Logika Update Slider, Emoji, dan Teks ---
        function updateValue(val) {
            // Update Angka
            document.getElementById('rangeValue').innerText = val + '%';
            
            const emoji = document.getElementById('reactionEmoji');
            const text = document.getElementById('progressText');
            
            // Ubah Visual berdasarkan Nilai (Kini lebih bertahap)
            if (val < 10) {
                emoji.innerText = "😭";
                text.innerText = "Kok gini amat biba...";
            } else if (val < 30) {
                emoji.innerText = "😟";
                text.innerText = "Dikit banget? Serius?";
            } else if (val < 50) {
                emoji.innerText = "😐";
                text.innerText = "Biasa aja ternyata...";
            } else if (val < 70) {
                emoji.innerText = "🙂";
                text.innerText = "Lumayan lah ya, nambah dikit.";
            } else if (val < 85) {
                emoji.innerText = "😊";
                text.innerText = "Cukup jauh juga ternyata.";
            } else if (val < 95) {
                emoji.innerText = "😄✨";
                text.innerText = "Dikit lagi mentok nih!";
            } else if (val < 100) {
                emoji.innerText = "🤩💖";
                text.innerText = "Hampir penuh!";
            } else {
                // Tepat 100%
                emoji.innerText = "🤯🎆🏆💞";
                text.innerText = "MAXIMAL! Ga ada saingan!";
            }
        }

        // --- Feedback Kirim Form ---
        document.getElementById('page2').addEventListener('submit', function() {
            alert('Jawaban kamu sudah tercatat di hati aku! Makasih ya biba 👍');
        });
    </script>
</body>
</html>
